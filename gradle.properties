# Pengaturan Gradle untuk VS Code Mobile.

# Batas memori JVM Gradle (cukup untuk build modul tunggal).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Tanpa daemon — build sekali saja, hemat memori di mesin terbatas.
org.gradle.daemon=false

# Kotlin dikompilasi di dalam proses Gradle (tanpa daemon Kotlin terpisah).
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
